<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Course Cards Section */
        .courses-section {
            flex: 2;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .course-card:hover {
            transform: translateY(-2px);
        }

        .course-name {
            font-size: 1.2em;
            margin: 0 0 10px;
            color: #1a73e8;
        }

        /* Chat Section */
        .chat-section {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 20px;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
        }

        .chat-message {
            background: #f1f3f4;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .chat-message.bot {
            background: #e8f0fe;
            margin-left: 15px;
        }

        .chat-message.user {
            background: #1a73e8;
            color: white;
            margin-left: auto;
        }

        .message-content {
            line-height: 1.6;
        }

        .message-content ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message-content li {
            margin-bottom: 6px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 1em;
        }

        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Skeleton Loading */
        .skeleton {
            background: #e0e0e0;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .skeleton::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.5),
                    transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Courses Section -->
        <div class="courses-section">
            <h2>My Classes</h2>
            <div class="courses-grid" id="courses-container">
                <!-- Skeleton Loading -->
                <div class="course-card skeleton" style="height: 150px"></div>
                <div class="course-card skeleton" style="height: 150px"></div>
                <div class="course-card skeleton" style="height: 150px"></div>
            </div>
        </div>

        <!-- Chat Section -->
        <div class="chat-section">
            <div class="chat-messages" id="chat-messages">
                <div class="chat-message skeleton" style="height: 40px; width: 60%"></div>
                <div class="chat-message skeleton" style="height: 40px; width: 80%; margin-left: auto"></div>
            </div>
            <div class="chat-input">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Fetch courses
        async function loadCourses() {
            try {
                const response = await fetch('http://localhost:8090/api/classes');
                const data = await response.json();

                const container = document.getElementById('courses-container');
                container.innerHTML = '';

                data.courses.forEach(course => {
                    const card = document.createElement('div');
                    card.className = 'course-card';
                    card.innerHTML = `
                        <h3 class="course-name">${course.name}</h3>
                        <p>Section: ${course.section}</p>
                        <p>Status: ${course.courseState}</p>
                        <a href="${course.alternateLink}" target="_blank">Open Classroom</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading courses:', error);
                coursesContainer.innerHTML = '<p>Error loading courses</p>';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (message) {
                addMessage(message, 'user');

                try {
                    const response = await fetch(`http://localhost:8090/api/chat?query=${encodeURIComponent(message)}`, {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json'
                            // No 'Content-Type' or body needed for query param
                        }
                    });

                    const data = await response.json();
                    const formattedContent = formatResponse(data.content);
                    addMessage(formattedContent, 'bot');

                } catch (error) {
                    console.error('Error sending message:', error);
                    addMessage('Error communicating with the server', 'error');
                }

                input.value = '';
            }
        }

            function formatResponse(content) {
                return content
                    .replace(/\n/g, '<br>')
                    .replace(/-\s/g, '• ')
                    .replace(/(\d+\.)\s/g, '<strong>$1</strong> ');
            }

            function addMessage(content, sender) {
                const messages = document.getElementById('chat-messages');
                const msgDiv = document.createElement('div');
                msgDiv.className = `chat-message ${sender}`;

                if (sender === 'bot') {
                    msgDiv.innerHTML = `
                    <div class="message-content">
                        ${content}
                    </div>
                `;
                } else {
                    msgDiv.textContent = content;
                }

                messages.appendChild(msgDiv);
                messages.scrollTop = messages.scrollHeight;
            }

            // Handle Enter key for sending messages
            document.getElementById('message-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            setTimeout(loadCourses, 1500);
    </script>
</body>

</html>
